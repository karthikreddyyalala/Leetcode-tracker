name: Daily LeetCode Review Reminder

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-reminder function
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X GET \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/send-reminder")

          echo "HTTP status: $STATUS"
          echo "Response body:"
          cat /tmp/response.json

          if [ "$STATUS" != "200" ]; then
            echo "Reminder function returned non-200 status: $STATUS"
            exit 1
          fi
